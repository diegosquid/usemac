# Keep blank issues on: UseMac's problem report window (ProblemReportIssueLink) opens a prefilled
# issues/new?title=…&body=… link, which needs the blank issue form.
blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/diegosquid/usemac/security/advisories/new
    about: Report security problems privately. Don't open a public issue for them.
  - name: Agent guide
    url: https://github.com/diegosquid/usemac/blob/main/.agents/AGENTS.md
    about: How agents connect to UseMac (socket, MCP, CLI), error codes and how to act reliably.
