name: Feature request
description: Suggest a new capability or a change to how UseMac works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you or your agent are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like UseMac to do. Include the methods, parameters or settings you have in mind, if any.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety
      description: Would this let agents reach or do anything they can't today? How should the execution modes, approvals or app and site rules apply to it?
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to implement this myself once the approach is agreed.
