name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    # Apple Silicon. Signing, notarization and releases stay on the maintainer's Mac.
    runs-on: macos-26
    timeout-minutes: 40
    env:
      # Pinned to the Xcode the releases are built with, so CI and local builds use the same Swift.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          node --version

      - name: Restore .build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: build-${{ runner.os }}-${{ runner.arch }}-xcode26.2-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ runner.arch }}-xcode26.2-${{ hashFiles('Package.resolved') }}-

      - name: swift build
        run: swift build

      - name: swift test
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/swift-test.log
        continue-on-error: false

      - name: Summarize Swift test failures
        if: failure()
        run: |
          if [[ -f /tmp/swift-test.log ]]; then
            echo "=== Failed Swift tests ==="
            grep -nE "failed|XCTAssert|error:" /tmp/swift-test.log | tail -n 100 || true
          fi

      - name: Extension tests
        run: node --test Tests/ExtensionTests/*.test.mjs
